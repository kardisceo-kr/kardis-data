name: 세계 동향 지표 갱신
on:
  schedule:
    - cron: "10 22 * * *"   # 매일 07:10 (한국 시간)
  push:
    branches: [main]
    paths: ["scripts/build_indicators.py", "indicators_manual.json", ".github/workflows/indicators.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: indicators
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지
        run: pip install openpyxl==3.1.5
      - name: indicators.json 생성
        run: python3 scripts/build_indicators.py
      - name: 변경 시 커밋
        run: |
          if git diff --quiet -- indicators.json && git ls-files --error-unmatch indicators.json >/dev/null 2>&1; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add indicators.json
          git commit -m "세계 동향 지표 갱신"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
